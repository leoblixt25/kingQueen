<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Basic Meta -->
    <title>King & Queen of the Beach</title>
    <meta name="description" content="Beach volleyball tournament app for matchups, scores, and rankings." />
    <meta name="author" content="Summer Spikers" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0077B6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph (for Facebook, WhatsApp, etc.) -->
    <meta property="og:title" content="King & Queen of the Beach" />
    <meta property="og:description" content="Track matchups, scores, and rankings in your beach volleyball tournament." />
    <meta property="og:image" content="https://kingqueen-eu.web.app/icon.png" />
    <meta property="og:url" content="https://kingqueen-eu.web.app" />
    <meta property="og:type" content="website" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="King & Queen of the Beach" />

    <!-- Twitter (also used by many apps) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="King & Queen of the Beach" />
    <meta name="twitter:description" content="Beach volleyball tournament app" />
    <meta name="twitter:image" content="https://kingqueen-eu.web.app/icon.png" />
    
    <!-- WhatsApp-specific -->
    <meta property="og:image:alt" content="King & Queen of the Beach - Beach Volleyball Tournament" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
