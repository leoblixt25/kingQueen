<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completing Sign In... | Sandy Scorekeeper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto 20px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        p {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        
        .email {
            font-weight: 600;
            color: #667eea;
            word-break: break-all;
        }
        
        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .success {
            background: #efe;
            border: 1px solid #cfc;
            color: #0a0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #5568d3;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">
            <div class="spinner"></div>
            <h1>Completing Sign In...</h1>
            <p>Please wait while we complete your authentication.</p>
        </div>
        
        <div id="error" class="hidden">
            <div class="error"></div>
            <h1>Sign In Failed</h1>
            <p>We couldn't complete your sign in. Please try again.</p>
            <a href="/" class="btn">Go to Home</a>
        </div>
        
        <div id="success" class="hidden">
            <div class="success">Successfully signed in!</div>
            <h1>Welcome Back!</h1>
            <p>Redirecting you to the app...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailLink } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB59VBp3g79K0yYxcCmxwdp0mvgGTbdxxU",
            authDomain: "kingqueen-c3543.firebaseapp.com",
            projectId: "kingqueen-c3543",
            storageBucket: "kingqueen-c3543.firebasestorage.app",
            messagingSenderId: "243756782404",
            appId: "1:243756782404:web:98d91f75b0e0c11d607d11"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // DOM elements
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const successEl = document.getElementById('success');
        const errorContentEl = errorEl.querySelector('.error');

        // Show error message
        function showError(message) {
            console.error('Auth Error:', message);
            errorContentEl.textContent = message;
            loadingEl.classList.add('hidden');
            errorEl.classList.remove('hidden');
        }

        // Show success and redirect
        function showSuccessAndRedirect() {
            loadingEl.classList.add('hidden');
            successEl.classList.remove('hidden');
            
            // Redirect to homepage after 2 seconds
            setTimeout(() => {
                window.location.href = '/';
            }, 2000);
        }

        // Main authentication logic
        async function completeSignIn() {
            try {
                const url = window.location.href;
                
                // Check if this is a valid sign-in link
                if (!auth.isSignInWithEmailLink(url)) {
                    throw new Error('Invalid or expired sign-in link. Please request a new one.');
                }

                // Get email from localStorage
                let email = localStorage.getItem('pendingSignInEmail');
                
                if (!email) {
                    // If email not in localStorage, prompt user for it
                    email = prompt('Please enter your email address to complete sign-in:');
                    
                    if (!email) {
                        throw new Error('Email address is required to complete sign-in.');
                    }
                }

                email = email.toLowerCase().trim();

                // Complete sign-in with Firebase
                const result = await signInWithEmailLink(auth, email, url);
                const user = result.user;

                console.log('✅ Email Link Sign-In Successful:', user.email);

                // Clear stored email
                localStorage.removeItem('pendingSignInEmail');

                // Show success and redirect
                showSuccessAndRedirect();

            } catch (error) {
                console.error('❌ Email Link Sign-In Error:', error.code, error.message);
                
                let errorMessage = 'Failed to complete sign-in. ';
                
                if (error.code === 'auth/expired-action-code') {
                    errorMessage = 'This sign-in link has expired. Please request a new one.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Invalid email address. Please check your email and try again.';
                } else if (error.code === 'auth/user-disabled') {
                    errorMessage = 'This account has been disabled. Please contact support.';
                } else if (error.code === 'auth/user-not-found') {
                    errorMessage = 'No account found with this email address.';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = 'Password is too weak. Please use a stronger password.';
                } else {
                    errorMessage += error.message || 'Please try again.';
                }

                showError(errorMessage);
            }
        }

        // Run authentication when page loads
        document.addEventListener('DOMContentLoaded', completeSignIn);
    </script>
</body>
</html>
